name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Windows x86_64
            os: windows-latest
          - name: macOS x86_64
            os: macos-15-intel
          - name: macOS aarch64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p centralcore --all-targets

  package:
    name: Package centralcore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package -p centralcore
      - run: tar -tf target/package/centralcore-*.crate
