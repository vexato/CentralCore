[workspace]
members = ["crates/centralcore", "crates/centralcorp-cli", "crates/centralcorp-sign"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/vexato/CentralCore"
homepage = "https://github.com/vexato/CentralCore"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
clap = { version = "4.5.47", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
futures-util = "0.3.31"
getrandom = "0.3.3"
fs2 = "0.4.3"
flate2 = "1.1.2"
md5 = "0.7.0"
keyring = { version = "3.3.0", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
quick-xml = { version = "0.38.3", features = ["serialize"] }
regex = "1.11.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "stream", "json"] }
rpassword = "7.4.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_jcs = "0.1.0"
sha1 = "0.10.6"
sha2 = "0.10.9"
sysinfo = "0.36.1"
tar = "0.4.44"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = { version = "2.5.7", features = ["serde"] }
zeroize = "=1.8.1"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
